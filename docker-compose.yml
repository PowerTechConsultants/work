services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hr}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    # no host port publish when using Tunnel; expose internally for cloudflared
    expose:
      - "42780"
    ports:
      - "127.0.0.1:42780:42780" # localhost access only
    environment:
      NODE_ENV: production
      PORT: 42780
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hr}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-hr}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set (>=32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set (>=32 chars)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:42780}
      APP_URL: ${APP_URL:-http://localhost:42780}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:42780/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Cloudflare Tunnel (optional) — exposes server:42780 (API + static web) via your Cloudflare hostname.
  # Create a tunnel in https://one.dash.cloudflare.com -> Networks -> Tunnels -> Create tunnel (Cloudflared),
  # set TUNNEL_TOKEN in .env, then start with:  docker compose --profile tunnel up -d
  # Without that profile the stack runs localhost-only and needs no token.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set — copy from Cloudflare dashboard}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    # optional: uncomment to use config file instead of token
    # volumes:
    #   - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    # command: tunnel --config /etc/cloudflared/config.yml run

  # Optional: standalone Vite preview for local dev without tunnel. Not used when server serves web/dist.
  # Enable with: docker compose --profile dev up
  web:
    profiles: ["dev"]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "42781:42780"
    environment:
      NODE_ENV: production
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
